version: 2

models:
  - name: stg_orders
    columns:
      - name: order_id
        tests:
          - not_null
      - name: order_status
        tests:
          - accepted_values:
              arguments:
                values: ['delivered', 'shipped', 'canceled', 'unavailable', 'invoiced', 'processing', 'created', 'approved']
      - name: product_id
        tests:
          - relationships:
              arguments:
                to: source('raw', 'dim_product')
                field: product_id
      - name: seller_id
        tests:
          - relationships:
              arguments:
                to: source('raw', 'dim_seller')
                field: seller_id
      - name: customer_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: source('raw', 'raw_customers')
                field: customer_id
      - name: price
        tests:
          - not_null